name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build Windows
        shell: powershell
        run: .\build\build_windows.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FioBenchmark-Windows
          path: release/FioBenchmark-Setup-Windows-x64.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            python3-pip \
            python3-tk \
            libaio-dev \
            liburing-dev \
            libgtk-3-0 \
            zlib1g-dev \
            libjpeg-dev \
            patchelf

      - name: Build Linux
        run: ./build/build_linux.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: FioBenchmark-Linux
          path: release/FioBenchmark-Linux-x86_64.AppImage
          if-no-files-found: error
